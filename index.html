<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AxioN! Tips</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0 30px;
    }

    .logo span {
      color: #00e676;
    }

    .card {
      background: #151b29;
      border: 1px solid #252d40;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 18px;
    }

    input,
    select,
    button,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #30394d;
      background: #0f1420;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      background: #00c853;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #252d40;
    }

    .danger {
      background: #d32f2f;
    }

    .hidden {
      display: none !important;
    }

    .auth-box {
      max-width: 450px;
      margin: 50px auto;
    }

    .switch {
      text-align: center;
      margin-top: 10px;
      color: #aaa;
      cursor: pointer;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: #151b29;
      border: 1px solid #252d40;
      border-radius: 14px;
      padding: 18px;
    }

    .stat small {
      color: #999;
      display: block;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 23px;
    }

    .green {
      color: #00e676;
    }

    .red {
      color: #ff5252;
    }

    .yellow {
      color: #ffd740;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .bet {
      background: #101622;
      border: 1px solid #273148;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .bet-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .bet-info {
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
    }

    .badge-green {
      background: #064d2b;
      color: #00e676;
    }

    .badge-red {
      background: #5c1111;
      color: #ff5252;
    }

    .badge-pending {
      background: #514300;
      color: #ffd740;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .topbar button {
      width: auto;
      padding: 10px 15px;
      margin: 0;
    }

    .message {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
    }

    .message.error {
      display: block;
      background: #5c1111;
      color: #ff8a80;
    }

    .message.success {
      display: block;
      background: #064d2b;
      color: #69f0ae;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 800px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 12px;
      }

      .logo {
        font-size: 27px;
      }

      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat {
        padding: 13px;
      }

      .stat strong {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<div id="authScreen" class="container">
  <div class="logo">AxioN<span>!</span> Tips</div>

  <div class="card auth-box">

    <div id="loginBox">
      <h2>Entrar</h2>

      <div id="loginMessage" class="message"></div>

      <label>E-mail</label>
      <input id="loginEmail" type="email" placeholder="seu@email.com">

      <label>Senha</label>
      <input id="loginPassword" type="password" placeholder="Sua senha">

      <button onclick="login()">Entrar</button>

      <div class="switch" onclick="showRegister()">
        Ainda não tenho conta
      </div>
    </div>

    <div id="registerBox" class="hidden">
      <h2>Criar conta</h2>

      <div id="registerMessage" class="message"></div>

      <label>Nickname</label>
      <input id="registerNickname" type="text" placeholder="Ex: JuniorTips">

      <label>E-mail</label>
      <input id="registerEmail" type="email" placeholder="seu@email.com">

      <label>Senha</label>
      <input id="registerPassword" type="password" placeholder="Mínimo recomendado: 6 caracteres">

      <button onclick="register()">Criar conta</button>

      <div class="switch" onclick="showLogin()">
        Já tenho uma conta
      </div>
    </div>

  </div>
</div>


<div id="appScreen" class="hidden">

  <div class="container">

    <div class="topbar">
      <div>
        <div class="logo" style="margin:0;text-align:left;">
          AxioN<span>!</span> Tips
        </div>
        <div id="userNickname" style="color:#aaa;"></div>
      </div>

      <button class="danger" onclick="logout()">Sair</button>
    </div>


    <div class="dashboard">

      <div class="stat">
        <small>Banca</small>
        <strong id="bankroll">R$ 0,00</strong>
      </div>

      <div class="stat">
        <small>Greens</small>
        <strong id="greens" class="green">0</strong>
      </div>

      <div class="stat">
        <small>Reds</small>
        <strong id="reds" class="red">0</strong>
      </div>

      <div class="stat">
        <small>Acerto</small>
        <strong id="hitRate" class="yellow">0%</strong>
      </div>

    </div>


    <div class="card">

      <h2>📊 Resumo</h2>

      <div class="grid">

        <div>
          <small>Lucro / Prejuízo</small>
          <h2 id="profit">R$ 0,00</h2>
        </div>

        <div>
          <small>Meta mensal</small>
          <h2 id="goal">R$ 0,00</h2>
        </div>

      </div>

    </div>


    <div class="card">

      <h2>⚽ Nova aposta</h2>

      <div id="betMessage" class="message"></div>

      <div class="grid">

        <div>
          <label>Liga / Campeonato</label>
          <input id="league" placeholder="Ex: Brasileirão">
        </div>

        <div>
          <label>Data e hora</label>
          <input id="matchDate" type="datetime-local">
        </div>

        <div>
          <label>Mandante</label>
          <input id="homeTeam" placeholder="Time mandante">
        </div>

        <div>
          <label>Visitante</label>
          <input id="awayTeam" placeholder="Time visitante">
        </div>

        <div>
          <label>Mercado</label>
          <select id="market">
            <option value="Resultado">Resultado</option>
            <option value="Dupla Chance">Dupla Chance</option>
            <option value="Total de Gols">Total de Gols</option>
            <option value="Escanteios">Escanteios</option>
            <option value="Cartões">Cartões</option>
            <option value="Ambas Marcam">Ambas Marcam</option>
            <option value="Handicap">Handicap</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div>
          <label>Seleção / Palpite</label>
          <input id="selection" placeholder="Ex: Mais de 1.5">
        </div>

        <div>
          <label>Odd</label>
          <input id="odds" type="number" step="0.01" placeholder="1.50">
        </div>

        <div>
          <label>Valor apostado</label>
          <input id="stake" type="number" step="0.01" placeholder="10.00">
        </div>

      </div>

      <label>Observações</label>
      <textarea id="notes" placeholder="Observações da aposta..."></textarea>

      <button onclick="addBet()">Adicionar aposta</button>

    </div>


    <div class="card">

      <h2>📋 Histórico de apostas</h2>

      <div class="grid">

        <input id="filterLeague" placeholder="Filtrar por liga">

        <select id="filterResult">
          <option value="">Todos os resultados</option>
          <option value="PENDING">Pendentes</option>
          <option value="GREEN">Greens</option>
          <option value="RED">Reds</option>
        </select>

      </div>

      <button class="secondary" onclick="loadBets()">Atualizar histórico</button>

      <div id="betsList"></div>

    </div>


    <div class="card">

      <h2>🎯 Meta mensal</h2>

      <input id="goalInput" type="number" step="0.01" placeholder="Ex: 500">

      <button onclick="saveGoal()">Salvar meta</button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL = "https://lvdknawajdktnfuzlllp.supabase.co";

const SUPABASE_KEY = "sb_publishable_Mb_5x7t0UFvzbd-Tup9E_w_lDflmVbK";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let currentBets = [];


function showLogin() {
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("registerBox").classList.add("hidden");
}


function showRegister() {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");
}


function showMessage(id, text, type) {
  const el = document.getElementById(id);

  el.textContent = text;
  el.className = "message " + type;
}


async function register() {

  const nickname =
    document.getElementById("registerNickname").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  if (!nickname || !email || !password) {
    showMessage(
      "registerMessage",
      "Preencha todos os campos.",
      "error"
    );
    return;
  }

  const { data, error } = await db.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        nickname: nickname
      }
    }
  });

  if (error) {
    showMessage(
      "registerMessage",
      error.message,
      "error"
    );
    return;
  }

  if (data.session) {

    showMessage(
      "registerMessage",
      "Conta criada com sucesso!",
      "success"
    );

    await loadApp();

  } else {

    showMessage(
      "registerMessage",
      "Conta criada! Se o Supabase solicitar confirmação de e-mail, confirme antes de entrar.",
      "success"
    );

    showLogin();
  }
}


async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Digite e-mail e senha.",
      "error"
    );

    return;
  }

  const { data, error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;
  }

  currentUser = data.user;

  await loadApp();
}


async function logout() {

  await db.auth.signOut();

  currentUser = null;

  document
    .getElementById("appScreen")
    .classList.add("hidden");

  document
    .getElementById("authScreen")
    .classList.remove("hidden");
}


async function loadApp() {

  const {
    data: {
      user
    }
  } = await db.auth.getUser();

  if (!user) {
    return;
  }

  currentUser = user;

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("appScreen")
    .classList.remove("hidden");


  const { data: profile } =
    await db
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();


  if (profile) {

    document
      .getElementById("userNickname")
      .textContent =
      "Olá, " + profile.nickname + " 👋";

  } else {

    document
      .getElementById("userNickname")
      .textContent =
      "Olá! 👋";
  }


  await loadBets();
  await loadGoal();
}


async function addBet() {

  const league =
    document.getElementById("league").value.trim();

  const homeTeam =
    document.getElementById("homeTeam").value.trim();

  const awayTeam =
    document.getElementById("awayTeam").value.trim();

  const matchDate =
    document.getElementById("matchDate").value;

  const market =
    document.getElementById("market").value;

  const selection =
    document.getElementById("selection").value.trim();

  const odds =
    parseFloat(document.getElementById("odds").value);

  const stake =
    parseFloat(document.getElementById("stake").value);

  const notes =
    document.getElementById("notes").value.trim();


  if (
    !homeTeam ||
    !awayTeam ||
    !market ||
    !odds ||
    !stake
  ) {

    showMessage(
      "betMessage",
      "Preencha os campos obrigatórios.",
      "error"
    );

    return;
  }


  const { error } =
    await db
      .from("bets")
      .insert({
        user_id: currentUser.id,
        league: league,
        home_team: homeTeam,
        away_team: awayTeam,
        match_date: matchDate || null,
        market: market,
        selection: selection,
        odds: odds,
        stake: stake,
        result: "PENDING",
        profit: 0,
        notes: notes
      });


  if (error) {

    showMessage(
      "betMessage",
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "betMessage",
    "Aposta adicionada com sucesso!",
    "success"
  );


  document
    .getElementById("league").value = "";

  document
    .getElementById("homeTeam").value = "";

  document
    .getElementById("awayTeam").value = "";

  document
    .getElementById("selection").value = "";

  document
    .getElementById("odds").value = "";

  document
    .getElementById("stake").value = "";

  document
    .getElementById("notes").value = "";


  await loadBets();
}


async function loadBets() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } = await db
    .from("bets")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending: false
    });


  if (error) {

    document
      .getElementById("betsList")
      .innerHTML =
      `<div class="empty">${error.message}</div>`;

    return;
  }


  currentBets = data || [];

  renderBets();

  updateDashboard();
}


function renderBets() {

  const container =
    document.getElementById("betsList");

  const leagueFilter =
    document
      .getElementById("filterLeague")
      .value
      .toLowerCase();

  const resultFilter =
    document
      .getElementById("filterResult")
      .value;


  let bets =
    currentBets.filter(bet => {

      const leagueOk =
        !leagueFilter ||
        (bet.league || "")
          .toLowerCase()
          .includes(leagueFilter);

      const resultOk =
        !resultFilter ||
        bet.result === resultFilter;

      return leagueOk && resultOk;
    });


  if (!bets.length) {

    container.innerHTML =
      `<div class="empty">Nenhuma aposta encontrada.</div>`;

    return;
  }


  container.innerHTML =
    bets.map(bet => {

      let badgeClass = "badge-pending";

      if (bet.result === "GREEN") {
        badgeClass = "badge-green";
      }

      if (bet.result === "RED") {
        badgeClass = "badge-red";
      }


      const date =
        bet.match_date
          ? new Date(bet.match_date)
              .toLocaleString("pt-BR")
          : "Sem data";


      return `

        <div class="bet">

          <div class="bet-title">
            ${escapeHtml(bet.home_team)}
            x
            ${escapeHtml(bet.away_team)}
          </div>

          <div class="bet-info">

            🏆 ${escapeHtml(bet.league || "Sem liga")}<br>

            📅 ${date}<br>

            🎲 ${escapeHtml(bet.market)}:
            ${escapeHtml(bet.selection || "-")}<br>

            💵 Odd:
            ${Number(bet.odds).toFixed(2)}<br>

            💰 Stake:
            R$ ${Number(bet.stake).toFixed(2)}

          </div>

          <span class="badge ${badgeClass}">
            ${bet.result}
          </span>

          ${
            bet.result === "PENDING"
            ? `
              <div class="grid" style="margin-top:10px;">
                <button
                  class="green"
                  onclick="finishBet('${bet.id}','GREEN')">
                  GREEN
                </button>

                <button
                  class="danger"
                  onclick="finishBet('${bet.id}','RED')">
                  RED
